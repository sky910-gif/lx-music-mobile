name: Build iOS IPA (unsigned)

# 在 GitHub 提供的云端 macOS runner 上构建 lx-music-mobile，
# 产出【未签名】IPA。无需 Mac、无需付费 Apple 开发者账号。
# 构建产物用 Sideloadly/AltStore + 普通 Apple ID 自签安装（7 天有效）。

on:
  # 支持手动触发（fork 后在 Actions 页面点 Run workflow）
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ios-ipa.yml'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Show toolchain versions
        run: |
          node -v
          npm -v
          ruby -v
          pod --version
          xcodebuild -version

      - name: Install JS dependencies
        run: npm ci

      - name: Install iOS pods (CocoaPods)
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Archive (CODE_SIGNING_ALLOWED=NO)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/LxMusicMobile.xcarchive \
            -derivedDataPath $PWD/build/derived \
            clean archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$PWD/build/LxMusicMobile.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app，archive 可能失败"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p "$PWD/build/Payload"
          cp -r "$APP_PATH" "$PWD/build/Payload/"
          cd "$PWD/build"
          # 从 package.json 读取版本号命名产物
          APP_VER=$(node -p "require('../../package.json').version" 2>/dev/null || echo "unknown")
          zip -qr "LxMusicMobile-${APP_VER}-unsigned.ipa" Payload
          shasum -a 256 "LxMusicMobile-${APP_VER}-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicMobile-unsigned-ipa
          path: build/*-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
